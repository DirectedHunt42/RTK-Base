server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /api/downloads/watchdog-log {
        alias /var/lib/rtk-base/watchdog/watchdog.log;
        default_type text/plain;
        add_header Content-Disposition 'attachment; filename="rtk-base-watchdog.log"';
    }

    location = /rtk-base-error.html {
        root /var/www;
        internal;
    }

    location / {
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /rtk-base-error.html;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
